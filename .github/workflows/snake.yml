name: Generate contribution snake

"on":
  schedule:
    - cron: "41 6 * * *" # daily, ~25 min after the profile-art refresh
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # palette matches the profile's terminal system: heatmap greens for the
      # dots, cursor blue (#58a6ff) for the snake
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#58a6ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p assets
          mv dist/github-snake.svg assets/github-snake.svg
          git add assets/github-snake.svg
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: refresh snake [skip ci]"
            # the profile-art workflow may have pushed while we ran — rebase first
            git pull --rebase origin main
            git push
          fi
