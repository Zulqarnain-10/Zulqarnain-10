name: Keep Spaces warm

# Hugging Face parks a Space on free CPU hardware after 48 hours without a
# visitor, and a sleeping Space serves an HF "restart" page instead of the demo.
# A ping every 12 hours keeps all four live demos awake for recruiters.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping each live demo
        run: |
          set -u
          failed=0
          for url in \
            "https://syedzulqarnainh-credit-risk-service.hf.space/health" \
            "https://syedzulqarnainh-tweet-emotion-pipeline.hf.space/health" \
            "https://syedzulqarnainh-medbot.hf.space/" \
            "https://syedzulqarnainh-jobcraft.hf.space/"
          do
            # A sleeping Space needs one request to start restarting and a
            # second one after boot to be counted as visited, so hit it twice.
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url")
            sleep 90
            code2=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$url")
            echo "$url -> $code then $code2"
            case "$code2" in 2*|3*) ;; *) failed=1 ;; esac
          done
          exit $failed
